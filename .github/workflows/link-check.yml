name: Link check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Fail the job when lychee finds broken links.
          # External sites can be flaky; add narrowly-scoped excludes only
          # for verified false positives, rather than disabling the check.
          fail: true
          args: --no-progress --include-fragments './**/*.md'
