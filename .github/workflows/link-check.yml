name: Link check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-links:
    name: Check internal Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links between files in this repo
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline checks links to files inside the repo only.
          # External URLs are skipped so the check never fails on a slow website.
          args: --offline --no-progress --root-dir "$(pwd)" './**/*.md'
          fail: true
